<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https: http://localhost:* http://127.0.0.1:* http://[::1]:*; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark light">
<title>Хор — много нейросетей в одном чате</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E✦%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="backdrop" id="backdrop"></div>
<aside class="sidebar" id="sidebar" aria-label="История диалогов">
  <div class="brand">Хор</div>
  <button class="primary wide" id="newChat" type="button">Новый чат</button>
  <input id="search" type="search" placeholder="Поиск по истории (Ctrl+K)" aria-label="Поиск по истории">
  <nav class="chats" id="chatList"></nav>
  <button class="ghost wide" id="openSettings" type="button">Настройки и ключи</button>
</aside>
<main class="main">
  <header class="top">
    <button class="icon only-mobile" id="menu" type="button" aria-label="Открыть меню">☰</button>
    <label class="sr" for="provider">Провайдер</label>
    <select id="provider"></select>
    <label class="sr" for="model">Модель</label>
    <input id="model" list="modelList" placeholder="ID модели" autocomplete="off" spellcheck="false">
    <datalist id="modelList"></datalist>
    <button class="icon" id="refreshModels" type="button" title="Обновить список моделей" aria-label="Обновить список моделей">⟳</button>
    <label class="check" id="freeWrap"><input type="checkbox" id="freeOnly"> только бесплатные</label>
    <span class="badge" id="accessBadge"></span>
    <button class="icon" id="openInfo" type="button" title="Лимиты и доступ" aria-label="Лимиты и тип доступа">ⓘ</button>
  </header>
  <section class="messages" id="messages" aria-live="polite"></section>
  <footer class="composer">
    <textarea id="input" rows="1" placeholder="Напишите сообщение. Enter — отправить, Shift+Enter — новая строка" aria-label="Сообщение"></textarea>
    <button class="primary" id="send" type="button">Отправить</button>
  </footer>
  <div class="toast" id="toast" role="status"></div>
</main>
<dialog id="settingsDlg"></dialog>
<dialog id="infoDlg"></dialog>
<script type="module" src="js/app.js"></script>
</body>
</html>
